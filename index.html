<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>墨 SUMI - ink timing</title>
<style>
  :root {
    --paper: #ece7dc;
    --paper-deep: #e2dccd;
    --ink: #1a1815;
    --ink-soft: #3a3631;
    --vermilion: #b23a2f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--paper);
    overflow: hidden;
    font-family: 'Departure Mono', 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; touch-action: manipulation; }
  canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 22px 26px;
    pointer-events: none;
    z-index: 5;
  }
  .hud .block { display: flex; flex-direction: column; gap: 2px; }
  .hud .label {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--ink-soft); opacity: 0.7;
  }
  .hud .value { font-size: 30px; line-height: 1; font-weight: 400; }
  .hud .right { text-align: right; }
  .combo { color: var(--vermilion); }

  /* center seal / title */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; text-align: center;
    background: rgba(236,231,220,0.82);
    backdrop-filter: blur(2px);
    transition: opacity 0.5s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .kanji {
    font-size: clamp(80px, 22vw, 190px); line-height: 0.9;
    font-weight: 400; letter-spacing: 4px;
  }
  .title-en {
    font-size: 13px; letter-spacing: 8px; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .how {
    font-size: 13px; letter-spacing: 1px; color: var(--ink-soft);
    max-width: 280px; line-height: 1.7;
  }
  .seal {
    margin-top: 4px;
    width: 64px; height: 64px;
    border: 2px solid var(--vermilion);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--vermilion); font-size: 26px;
    cursor: pointer; pointer-events: auto;
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .seal:hover { transform: scale(1.06); background: rgba(178,58,47,0.08); }
  .seal:active { transform: scale(0.94); }
  .prompt { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--ink-soft); opacity: 0.6; }
  .final { font-size: 15px; letter-spacing: 2px; color: var(--ink); }
  .final b { color: var(--vermilion); font-size: 40px; display: block; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
</div>

<div class="hud" aria-hidden="true">
  <div class="block">
    <span class="label">Score</span>
    <span class="value" id="score">0</span>
  </div>
  <div class="block right">
    <span class="label">Combo</span>
    <span class="value combo" id="combo">×0</span>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="kanji">墨</div>
  <div class="title-en">sumi · ink timing</div>
  <div class="how" id="how">
    Strokes fall toward the stone.<br>
    Tap when a stroke meets the ring.<br>
    Closer to center, cleaner the ink.
  </div>
  <div class="seal" id="start" role="button" tabindex="0" aria-label="Start">始</div>
  <div class="prompt">tap the seal</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const howEl = document.getElementById('how');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');

  let W, H, cx, cy, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- game state ----
  const RING = () => Math.min(W, H) * 0.13;   // radius of the target ring
  let strokes = [];      // incoming ink strokes
  let splashes = [];     // ink splash particles on hit
  let ripples = [];      // ring feedback
  let running = false;
  let score = 0, combo = 0, best = 0;
  let spawnTimer = 0, spawnGap = 1500;
  let lastT = 0;

  function reset() {
    strokes = []; splashes = []; ripples = [];
    score = 0; combo = 0; spawnGap = 1500; spawnTimer = 0;
    scoreEl.textContent = '0';
    comboEl.textContent = '×0';
  }

  // a stroke travels from a random edge angle inward
  function spawnStroke() {
    const ring = RING();
    const angle = Math.random() * Math.PI * 2;
    const startDist = Math.max(W, H) * 0.62 + 80;
    strokes.push({
      angle,
      dist: startDist,             // distance from center
      speed: startDist / (spawnGap * 0.0011 + 900) * 16, // tuned below
      hit: false,
      width: 5 + Math.random() * 3,
      seed: Math.random() * 1000,
    });
  }

  // judge a tap: find the stroke closest to the ring
  function judge() {
    if (!running) return;
    const ring = RING();
    let bestStroke = null, bestErr = Infinity;
    for (const s of strokes) {
      if (s.hit) continue;
      const err = Math.abs(s.dist - ring);
      if (err < bestErr) { bestErr = err; bestStroke = s; }
    }
    const tol = ring * 0.9; // only judge strokes reasonably near
    if (!bestStroke || bestErr > tol) {
      // tapped with nothing near, soft penalty to combo
      combo = 0; comboEl.textContent = '×0';
      ripples.push({ r: ring, a: 0.5, miss: true });
      return;
    }
    bestStroke.hit = true;
    // accuracy 0..1 (1 = perfect on the ring)
    const acc = 1 - Math.min(bestErr / (ring * 0.75), 1);
    let gain, quality;
    if (acc > 0.85) { gain = 100; quality = 'perfect'; }
    else if (acc > 0.55) { gain = 60; quality = 'good'; }
    else { gain = 25; quality = 'ok'; }
    combo++;
    gain += combo * 5;
    score += gain;
    if (score > best) best = score;
    scoreEl.textContent = score;
    comboEl.textContent = '×' + combo;
    // ink splash at the stroke's position on the ring
    const px = cx + Math.cos(bestStroke.angle) * ring;
    const py = cy + Math.sin(bestStroke.angle) * ring;
    makeSplash(px, py, acc, bestStroke.angle);
    ripples.push({ r: ring, a: 0.6, miss: false });
  }

  function makeSplash(x, y, acc, angle) {
    // cleaner ink = fewer, tighter droplets; messy = more spray
    const n = Math.floor(6 + (1 - acc) * 22);
    const spread = 0.5 + (1 - acc) * 2.4;
    const baseR = 6 + acc * 10;
    // central blot
    splashes.push({ x, y, r: baseR, vr: 0.6, a: 0.9, vx: 0, vy: 0, life: 1, blot: true });
    for (let i = 0; i < n; i++) {
      const a = angle + (Math.random() - 0.5) * spread * 2 + Math.PI; // splash away from incoming
      const sp = (1 - acc) * 5 + Math.random() * 4 + 1;
      splashes.push({
        x, y,
        vx: Math.cos(a) * sp * (0.5 + Math.random()),
        vy: Math.sin(a) * sp * (0.5 + Math.random()),
        r: 1 + Math.random() * (2 + (1 - acc) * 3),
        vr: -0.02,
        a: 0.7 + Math.random() * 0.25,
        life: 1,
        blot: false,
      });
    }
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    running = true;
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  // ---- input ----
  function onTap(e) {
    if (!running) return;
    e.preventDefault();
    judge();
  }
  document.getElementById('stage').addEventListener('pointerdown', onTap);

  startBtn.addEventListener('click', (e) => { e.stopPropagation(); start(); });

  // ---- render ----
  function drawStone() {
    const ring = RING();
    // ink stone : soft filled disc with brush texture
    ctx.save();
    ctx.translate(cx, cy);
    // outer faint ring (target)
    ctx.beginPath();
    ctx.arc(0, 0, ring, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(26,24,21,0.28)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // inner stone
    const g = ctx.createRadialGradient(-ring*0.2, -ring*0.2, ring*0.1, 0, 0, ring*0.7);
    g.addColorStop(0, 'rgba(26,24,21,0.10)');
    g.addColorStop(1, 'rgba(26,24,21,0.02)');
    ctx.beginPath();
    ctx.arc(0, 0, ring * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

  }

  function drawStroke(s) {
    // an ink brush stroke pointing toward center, tapering
    const x = cx + Math.cos(s.angle) * s.dist;
    const y = cy + Math.sin(s.angle) * s.dist;
    const len = 46;
    const tx = cx + Math.cos(s.angle) * (s.dist - len);
    const ty = cy + Math.sin(s.angle) * (s.dist - len);
    ctx.save();
    ctx.lineCap = 'round';
    // shadow tail (lighter)
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(tx, ty);
    ctx.strokeStyle = 'rgba(26,24,21,0.85)';
    ctx.lineWidth = s.width;
    ctx.stroke();
    // head dot
    ctx.beginPath();
    ctx.arc(tx, ty, s.width * 0.75, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(26,24,21,0.9)';
    ctx.fill();
    ctx.restore();
  }

  function drawSplashes() {
    for (const p of splashes) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.5, p.r), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(26,24,21,${Math.max(0, p.a)})`;
      ctx.fill();
    }
  }

  function drawRipples() {
    for (const r of ripples) {
      ctx.beginPath();
      ctx.arc(cx, cy, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = r.miss
        ? `rgba(178,58,47,${r.a})`
        : `rgba(26,24,21,${r.a})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(t - lastT, 50);
    lastT = t;

    // difficulty ramp
    spawnGap = Math.max(620, 1500 - score * 0.12);
    spawnTimer += dt;
    if (spawnTimer >= spawnGap) {
      spawnTimer = 0;
      spawnStroke();
    }

    ctx.clearRect(0, 0, W, H);

    // subtle paper vignette
    drawStone();

    const ring = RING();
    // update strokes
    const baseSpeed = Math.min(W, H) * 0.00028; // px per ms relative
    for (const s of strokes) {
      if (!s.hit) {
        s.dist -= (0.16 + score * 0.00002) * dt * (Math.min(W,H)/520);
        if (s.dist <= ring * 0.18) {
          s.hit = true;
          combo = 0; comboEl.textContent = '×0';
        }
      }
      if (!s.hit || s.dist > ring * 0.18) drawStroke(s);
    }
    strokes = strokes.filter(s => !s.hit && s.dist > 0);

    // update splashes
    for (const p of splashes) {
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.92; p.vy *= 0.92;
      if (p.blot) { p.r += p.vr; p.a -= 0.012; }
      else { p.a -= 0.02; p.vy += 0.04; }
    }
    splashes = splashes.filter(p => p.a > 0.02);
    drawSplashes();

    // update ripples
    for (const r of ripples) { r.r += 3.4; r.a -= 0.03; }
    ripples = ripples.filter(r => r.a > 0.02);
    drawRipples();

    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
